# Builds the installers and publishes them as a GitHub release, which the app's "Check for updates" reads.
#   Release:  push a tag like v1.0.1 (the app's version in app/package.json must match).
#   Try out:  Actions > Build installers > Run workflow (builds and keeps the files as run artifacts, no release).
# Signing is optional: add the secrets listed in BUILDING.md.
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload the installers

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: macos-15          # Apple Silicon
            target: --mac --arm64
          - os: macos-15-intel    # Intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/package-lock.json }

      - name: Bundle the engine
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.16"
          python -m PyInstaller --noconfirm --distpath pkg --workpath build packaging/fmskin-core.spec

      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run build:web
          npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/*.dmg
            app/release/*.zip
            app/release/latest*.yml
          if-no-files-found: error

  # One release with every installer, created after all builds finish (tags only).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir files
          cp out/installers-windows-latest/* files/
          cp out/installers-macos-15/* files/                      # Apple Silicon, with latest-mac.yml
          find out/installers-macos-15-intel -name '*.dmg' -o -name '*.zip' | xargs -I{} cp {} files/
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "FM Skin Studio ${GITHUB_REF_NAME#v}"             --notes "Windows: FM-Skin-Studio-Setup-${GITHUB_REF_NAME#v}.exe · Mac: the -arm64.dmg (Apple Silicon) or -x64.dmg (Intel)."
